<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <!-- Arrow Marker for <<include>> / dependencies -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <!-- Drop Shadow for Cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="1">RESEARCH BUDDY - UML USE CASE DIAGRAM</text>

  <!-- System Boundary Box -->
  <rect x="250" y="70" width="600" height="640" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)" />
  <rect x="250" y="70" width="600" height="40" rx="20" fill="#1d4ed8" fill-opacity="0.2" />
  <text x="550" y="96" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold" letter-spacing="1.5">SYSTEM BOUNDARY: RESEARCH BUDDY</text>

  <!-- ================= ACTOR 1: USER (Left) ================= -->
  <!-- Stick Figure: User -->
  <g id="actor-user" transform="translate(110, 310)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Body -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#38bdf8" stroke-width="3"/>
    <!-- Arms -->
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#38bdf8" stroke-width="3"/>
    <!-- Left Leg -->
    <line x1="0" y1="25" x2="-22" y2="65" stroke="#38bdf8" stroke-width="3"/>
    <!-- Right Leg -->
    <line x1="0" y1="25" x2="22" y2="65" stroke="#38bdf8" stroke-width="3"/>
    <!-- Label -->
    <text x="0" y="95" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">User /</text>
    <text x="0" y="115" text-anchor="middle" fill="#94a3b8" font-size="14">Researcher</text>
  </g>

  <!-- ================= ACTOR 2: GEMINI AI (Right) ================= -->
  <!-- Cloud / AI Bot: Gemini -->
  <g id="actor-ai" transform="translate(980, 320)">
    <!-- Bot/Cloud Head Box -->
    <rect x="-35" y="-55" width="70" height="55" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-15" cy="-30" r="5" fill="#c084fc"/>
    <circle cx="15" cy="-30" r="5" fill="#c084fc"/>
    <!-- Antenna -->
    <line x1="0" y1="-55" x2="0" y2="-70" stroke="#a855f7" stroke-width="3"/>
    <circle cx="0" cy="-74" r="5" fill="#e879f9"/>
    <!-- Body -->
    <line x1="0" y1="0" x2="0" y2="35" stroke="#a855f7" stroke-width="3"/>
    <!-- Arms -->
    <line x1="-25" y1="12" x2="25" y2="12" stroke="#a855f7" stroke-width="3"/>
    <!-- Stand / Base -->
    <path d="M -20 50 L 0 35 L 20 50" fill="none" stroke="#a855f7" stroke-width="3"/>
    <!-- Label -->
    <text x="0" y="80" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">External AI</text>
    <text x="0" y="100" text-anchor="middle" fill="#c084fc" font-size="14">Google Gemini API</text>
  </g>

  <!-- ================= CONNECTION LINES ================= -->
  <!-- User to Use Cases (Solid Lines) -->
  <line x1="145" y1="310" x2="350" y2="160" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="310" x2="350" y2="240" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="330" x2="350" y2="320" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="350" x2="350" y2="410" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="370" x2="350" y2="500" stroke="#64748b" stroke-width="1.8"/>
  <line x1="145" y1="390" x2="370" y2="590" stroke="#64748b" stroke-width="1.8"/>

  <!-- AI to Use Cases (Solid Lines) -->
  <line x1="935" y1="320" x2="745" y2="320" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line x1="935" y1="340" x2="745" y2="410" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line x1="935" y1="380" x2="720" y2="665" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4,4"/>

  <!-- Include Relationship (Generate -> Model Failover) -->
  <path d="M 550 355 L 550 635" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="490" y="475" width="120" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="550" y="490" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">&lt;&lt;includes&gt;&gt;</text>

  <!-- ================= USE CASES (OVALS) ================= -->

  <!-- UC1: Register / Sign Up -->
  <g transform="translate(430, 160)">
    <ellipse cx="120" cy="0" rx="145" ry="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Register / Sign Up Account</text>
  </g>

  <!-- UC2: Sign In / Authenticate -->
  <g transform="translate(430, 240)">
    <ellipse cx="120" cy="0" rx="145" ry="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Sign In / Authenticate</text>
  </g>

  <!-- UC3: Generate Structured Research Paper -->
  <g transform="translate(430, 320)">
    <ellipse cx="120" cy="0" rx="170" ry="35" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="120" y="-5" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Generate Research Paper</text>
    <text x="120" y="14" text-anchor="middle" fill="#c7d2fe" font-size="11">(Abstract, Intro, Findings, Discussion)</text>
  </g>

  <!-- UC4: Check Plagiarism & Originality -->
  <g transform="translate(430, 410)">
    <ellipse cx="120" cy="0" rx="155" ry="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Check Plagiarism &amp; Originality</text>
  </g>

  <!-- UC5: Humanize AI Text -->
  <g transform="translate(430, 500)">
    <ellipse cx="120" cy="0" rx="145" ry="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Humanize AI Text (NLTK)</text>
  </g>

  <!-- UC6: Track Word Count -->
  <g transform="translate(430, 580)">
    <ellipse cx="120" cy="0" rx="140" ry="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Track Real-Time Word Count</text>
  </g>

  <!-- UC7: Automatic Model Failover -->
  <g transform="translate(430, 665)">
    <ellipse cx="120" cy="0" rx="160" ry="32" fill="#2e1065" stroke="#c084fc" stroke-width="2"/>
    <text x="120" y="-3" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold">Automatic Model Failover</text>
    <text x="120" y="14" text-anchor="middle" fill="#e9d5ff" font-size="10">(Gemini 3.5 Flash-Lite &rarr; Gemma 4 31B)</text>
  </g>

</svg>
